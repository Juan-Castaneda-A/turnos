<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnos - Notaría Tercera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/visualizador.css') }}" rel="stylesheet">
</head>

<body class="bg-slate-950 text-white h-screen w-screen overflow-hidden flex flex-col selection:bg-none">

    <header class="flex justify-between items-center px-8 py-4 bg-slate-900/80 border-b border-slate-800 z-20 h-[10vh]">
        <div class="flex items-center gap-4">
            <img src="{{ url_for('static', filename='img/logo_not.png') }}" alt="Logo" class="h-16 object-contain drop-shadow-lg">
            <h1 class="text-2xl font-Rubik text-slate-400 uppercase tracking-widest hidden md:block">Atención al Usuario</h1>
        </div>
        <div id="clock" class="text-4xl font-JetBrains text-blue-400 font-bold drop-shadow-md">00:00</div>
    </header>

    <main class="flex-grow relative p-6 overflow-hidden z-0 h-[82vh]">
        
        <div id="view-main" class="absolute inset-0 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 transition-all duration-700 ease-in-out bg-gray-900">
            
            <section id="current-turn-display" class="lg:col-span-2 bg-gradient-to-br from-slate-800 to-slate-900 rounded-3xl border-2 border-slate-700 shadow-[0_0_50px_rgba(0,0,0,0.5)] flex flex-col items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 bg-blue-600/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                <div class="relative z-10 flex flex-col items-center w-full">
                    <p class="text-4xl text-slate-400 font-Rubik font-medium mb-4 uppercase tracking-[0.2em]">Turno Actual</p>
                    <div id="current-turn-number" class="font-JetBrains font-bold text-white text-[12rem] leading-none drop-shadow-[0_0_15px_rgba(255,255,255,0.5)]">---</div>
                    <div class="w-2/3 h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent my-8 opacity-80"></div>
                    <div id="current-turn-module" class="font-Rubik font-black text-yellow-400 text-6xl uppercase tracking-wide drop-shadow-lg">Esperando...</div>
                </div>
            </section>

            <aside class="lg:col-span-1 flex flex-col gap-4 h-full">
                <div class="bg-slate-800 rounded-2xl p-4 text-center border border-slate-700 shadow-lg">
                    <h2 class="text-xl font-bold text-blue-300 uppercase tracking-widest font-Rubik">Últimos Llamados</h2>
                </div>
                <div id="call-history" class="flex-grow bg-slate-900/50 rounded-3xl border border-slate-800 p-4 overflow-y-auto space-y-3">
                    </div>
                <div class="bg-slate-800 rounded-2xl p-4 border-t-4 border-green-500 shadow-lg mt-auto">
                    <div class="flex justify-between items-end">
                        <span class="text-slate-400 text-sm uppercase">Estado</span>
                        <span class="text-green-400 font-bold text-lg animate-pulse">● En Servicio</span>
                    </div>
                </div>
            </aside>
        </div>

        <div id="view-status" class="absolute inset-0 flex flex-col bg-gray-900 p-6 transition-all duration-700 ease-in-out opacity-0 pointer-events-none transform scale-95 z-0">
            
            <div class="text-center mb-6">
                <h2 class="text-4xl font-black text-blue-400 uppercase tracking-[0.2em] font-Rubik drop-shadow-lg">
                    Estado de Módulos
                </h2>
            </div>
            
            <div id="modules-grid" class="flex-grow grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 overflow-y-auto pb-4">
                </div>

        </div>
    </main>

    <div id="message-ticker-container" class="h-[8vh] bg-blue-900 text-white flex items-center border-t-4 border-yellow-500 relative z-20 overflow-hidden shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
        <div class="whitespace-nowrap animate-marquee inline-block px-4 font-Rubik font-semibold text-2xl" id="message-ticker-text">
            </div>
    </div>
    
    <div id="silence-banner" class="fixed inset-0 bg-red-600 z-50 hidden flex-col items-center justify-center animate-bg-pulse">
        <svg class="w-48 h-48 text-white mb-8 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
        </svg>
        <h1 class="text-[10vw] font-black text-white uppercase tracking-widest text-center leading-none drop-shadow-2xl">
            Silencio
        </h1>
        <p class="text-3xl text-white/90 mt-4 font-bold">Por favor espere su turno</p>
    </div>

    <audio id="call-sound" src="{{ url_for('static', filename='audio/doble_sonido_rapido.mp3') }}"></audio>

    <script>
        window.SUPABASE_URL = "{{ supabase_url }}";
        window.SUPABASE_KEY = "{{ supabase_key }}";
    </script>
    <script type="module" src="{{ url_for('static', filename='js/visualizador.js') }}"></script>

    <div id="fullscreen-alert" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md flex flex-col justify-center items-center z-40 hidden transition-all duration-300">
        <div class="text-gray-400 text-4xl font-bold mb-4 uppercase tracking-widest">Atención Turno</div>
        <div id="fullscreen-turn-number" class="font-JetBrains font-black text-yellow-400 leading-none tracking-tighter drop-shadow-[0_0_60px_rgba(250,204,21,0.6)] scale-150" style="font-size: 25vw;">---</div>
        <div class="mt-12 text-5xl text-white font-bold bg-blue-600 px-12 py-4 rounded-2xl shadow-2xl">
            Módulo <span id="fullscreen-turn-module" class="text-white">---</span>
        </div>
    </div>

</body>
</html>
